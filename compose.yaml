# Two ways to run Stay Flow:
#   docker compose up -d                        Postgres and Mailpit, for `pnpm dev` on the host.
#   docker compose --profile full up -d --build  The whole stack, with the demo hotel, at
#                                               http://localhost:8080.
# Add `--profile monitoring` to the second for Prometheus, Alertmanager and Grafana, as on the
# server: Grafana at http://localhost:3002 (no login), alerts in Mailpit at http://localhost:8025.
name: stay-flow

x-api-environment: &api-environment
  NODE_ENV: production
  LOG_LEVEL: info
  DATABASE_URL: postgres://stayflow:stayflow@postgres:5432/stayflow
  SMTP_URL: smtp://mailpit:1025
  MAIL_FROM: Stay Flow <bookings@stayflow.test>
  WEB_URL: http://localhost:8080
  TRUSTED_ORIGINS: http://localhost:8080
  # Requests reach the API through the web server, which adds X-Forwarded-For.
  TRUST_PROXY_HOPS: '1'
  METRICS_PORT: '9464'
  WORKER_METRICS_PORT: '9465'

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: stayflow
      POSTGRES_PASSWORD: stayflow
      POSTGRES_DB: stayflow
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      # Postgres 18 images keep data in a versioned folder under this path.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stayflow -d stayflow']
      interval: 2s
      timeout: 3s
      retries: 15

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - '127.0.0.1:1025:1025' # SMTP
      - '127.0.0.1:8025:8025' # Web inbox

  # Runs once: applies the migrations, then adds the demo hotel if it is not there yet.
  migrate:
    profiles: [full]
    image: stay-flow-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['sh', '-c', 'node dist/platform/database/migrate.js && node dist/seed/seed.js']
    environment:
      <<: *api-environment
      SEED_DEMO_DATA: 'true'
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: [full]
    image: stay-flow-api
    environment: *api-environment
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health/ready']
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Expires holds, marks no-shows, sends the booking emails from the outbox.
  worker:
    profiles: [full]
    image: stay-flow-api
    command: ['node', '--enable-source-maps', 'dist/worker.js']
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    profiles: [full]
    image: stay-flow-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:3000
    environment:
      API_URL: http://api:3000
    ports:
      - '127.0.0.1:8080:3001'
    healthcheck:
      # 127.0.0.1, not localhost: the server listens on IPv4 only, and localhost may resolve to ::1.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/']
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      api:
        condition: service_healthy

  # The server's monitoring, at the same versions (see deploy/compose.yaml), minus what only the
  # server has: Caddy, the host exporter and Telegram.
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.local.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./deploy/monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus

  alertmanager:
    profiles: [monitoring]
    image: prom/alertmanager:v0.34.2
    command:
      - --config.file=/etc/alertmanager/alertmanager.local.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
    ports:
      - '127.0.0.1:9093:9093'
    volumes:
      - ./deploy/monitoring/alertmanager:/etc/alertmanager:ro

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:13.2.5
    environment:
      # Only this machine reaches it, so everyone who opens it is an admin, without a login.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/bookings.json
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      # Each bundled data source runs as a process of its own, about 10 MB each. Only Prometheus is
      # used, so the rest stay off. With the Go heap limit below, Grafana stays under 150 MB.
      GF_PLUGINS_DISABLE_PLUGINS: elasticsearch,grafana-postgresql-datasource,grafana-pyroscope-datasource,influxdb,jaeger,loki,mssql,mysql,opentsdb,stackdriver,tempo,zipkin,graphite,cloudwatch,grafana-azure-monitor-datasource,grafana-testdata-datasource
      GOMEMLIMIT: 120MiB
      # No live push to browsers: each dashboard refreshes on its own timer.
      GF_LIVE_MAX_CONNECTIONS: '0'
      GF_LOG_LEVEL: warn
    ports:
      - '127.0.0.1:3002:3000'
    volumes:
      - ./deploy/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro

  postgres-exporter:
    profiles: [monitoring]
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_URI: postgres:5432/stayflow?sslmode=disable
      DATA_SOURCE_USER: stayflow
      DATA_SOURCE_PASS: stayflow
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  prometheus-data:
