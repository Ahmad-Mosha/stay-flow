# Local development only. The API runs on the host with `pnpm dev`.
name: stay-flow

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: stayflow
      POSTGRES_PASSWORD: stayflow
      POSTGRES_DB: stayflow
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      # Postgres 18 images keep data in a versioned folder under this path.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stayflow -d stayflow']
      interval: 2s
      timeout: 3s
      retries: 15

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - '127.0.0.1:1025:1025' # SMTP
      - '127.0.0.1:8025:8025' # Web inbox

volumes:
  postgres-data:
