name: Deploy

# A pull request only builds the images, to catch a broken Dockerfile. Once CI passes on main, the
# images are pushed to GHCR and the server runs them. See deploy/README.md for the setup.
on:
  pull_request:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # After CI, the commit CI checked, which may no longer be the newest on main.
  COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  images:
    name: Build the ${{ matrix.app }} image
    # workflow_run also fires for pull requests from forks whose branch is called main: only a push
    # to this repository that passed CI may publish images.
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.COMMIT }}
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          # Each commit gets its own tag, so a deploy names exactly what it runs.
          tags: |
            ghcr.io/ahmad-mosha/stay-flow-${{ matrix.app }}:${{ env.COMMIT }}
            ghcr.io/ahmad-mosha/stay-flow-${{ matrix.app }}:latest
          # The source label links the package to this repository on GitHub.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.COMMIT }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    name: Deploy to the server
    needs: images
    # Skipped until the server is set up and DEPLOY_HOST is saved as a repository variable.
    if: github.event_name != 'pull_request' && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: https://${{ vars.DEPLOY_HOST }}
    env:
      TARGET: ${{ vars.DEPLOY_USER || 'deploy' }}@${{ vars.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.COMMIT }}
          sparse-checkout: deploy
      - name: Load the SSH key and the server's host key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copy the stack files
        run: scp -r deploy/compose.yaml deploy/Caddyfile deploy/*.sh deploy/monitoring "$TARGET:/opt/stay-flow/"
      - name: Pull and start the new images
        run: ssh "$TARGET" /opt/stay-flow/deploy.sh "$COMMIT"
