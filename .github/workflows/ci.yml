name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a pull request replaces its run. Every commit on main finishes its run, so the
  # deploy and the README badge always have a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Lint, type check, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # Type checking first: it generates the Next.js route types that typed linting reads.
      - run: pnpm typecheck
      - run: pnpm lint
      # Integration tests start their own PostgreSQL 18 container through Testcontainers.
      - run: pnpm test
      - run: pnpm build

  schema:
    name: Migrations and generated types
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: stayflow
          POSTGRES_PASSWORD: stayflow
          POSTGRES_DB: stayflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stayflow -d stayflow"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://stayflow:stayflow@localhost:5432/stayflow
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply every migration to an empty database
        run: pnpm db:migrate
      - name: Run migrations again (must be a no-op)
        run: pnpm db:migrate
      - name: Check that generated database types match the schema
        run: pnpm --filter @stay-flow/api db:codegen:verify

  monitoring:
    name: Monitoring config and alert rules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Placeholders: the production Compose file refuses to load without them.
      DOMAIN: stayflow.example
      ACME_EMAIL: ops@stayflow.example
      POSTGRES_PASSWORD: ci
      GRAFANA_ADMIN_PASSWORD: ci
      POSTGRES_EXPORTER_PASSWORD: ci
      TELEGRAM_BOT_TOKEN: ci
      TELEGRAM_CHAT_ID: '0'
      COMPOSE_FILE: deploy/compose.yaml
    steps:
      - uses: actions/checkout@v7
      - name: Check the production Compose file
        run: docker compose config --quiet
      # Each tool runs from its service's image, so it checks with the version the server runs.
      - name: Check the Prometheus configs
        run: |
          for config in prometheus.yml prometheus.local.yml; do
            docker compose run --rm --no-deps --entrypoint promtool prometheus \
              check config "/etc/prometheus/$config"
          done
      - name: Run the alert rule tests
        run: >-
          docker compose run --rm --no-deps --workdir /etc/prometheus --entrypoint promtool
          prometheus test rules tests/alerts.test.yml
      - name: Check the Alertmanager configs
        run: >-
          docker compose run --rm --no-deps --entrypoint amtool alertmanager check-config
          /etc/alertmanager/alertmanager.yml /etc/alertmanager/alertmanager.local.yml
      - name: Check the Caddyfile
        run: docker compose run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @stay-flow/e2e
      # The same images and Compose file a reviewer runs, with the demo hotel seeded.
      - name: Start the whole stack
        run: docker compose --profile full up -d --build --wait
      - name: Install Chromium
        run: pnpm --filter @stay-flow/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Show the stack's logs
        if: failure()
        run: docker compose --profile full logs --no-color
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
