# Production stack for one small server (1 vCPU, 1 GB RAM, 2 GB swap). The images come from GHCR,
# built by the Deploy workflow; nothing is built on the server. See README.md in this folder.
name: stay-flow

x-logging: &logging # Docker keeps container logs forever by default, which fills a small disk.
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

x-api-environment: &api-environment
  NODE_ENV: production
  LOG_LEVEL: info
  DATABASE_URL: postgres://stayflow:${POSTGRES_PASSWORD:?}@postgres:5432/stayflow
  # The API and the worker each keep this many connections; Postgres allows 30 in all.
  DATABASE_POOL_MAX: '5'
  SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
  MAIL_FROM: ${MAIL_FROM:-Stay Flow <bookings@stayflow.test>}
  WEB_URL: https://${DOMAIN:?}
  # Caddy is the only proxy in front of the API, and it adds X-Forwarded-For.
  TRUST_PROXY_HOPS: '1'
  # Prometheus scrapes these on the private network; neither port is published.
  METRICS_PORT: '9464'
  WORKER_METRICS_PORT: '9465'

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    # Sized for a 1 GB server shared with four other containers; the defaults assume more memory.
    command: >-
      postgres
      -c shared_buffers=64MB
      -c effective_cache_size=256MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c max_connections=30
    environment:
      POSTGRES_USER: stayflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: stayflow
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stayflow -d stayflow']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  # Runs on every deploy before the new API starts, and exits.
  migrate:
    image: ghcr.io/ahmad-mosha/stay-flow-api:${IMAGE_TAG:-latest}
    logging: *logging
    command: ['node', 'dist/platform/database/migrate.js']
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ghcr.io/ahmad-mosha/stay-flow-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    mem_limit: 192m
    environment:
      <<: *api-environment
      # A heap cap below the container's, so V8 collects garbage before the kernel kills it.
      NODE_OPTIONS: --max-old-space-size=128
    healthcheck:
      test: ['CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1:3000/health/ready']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 2s
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Expires holds, marks no-shows and sends the booking emails from the outbox.
  worker:
    image: ghcr.io/ahmad-mosha/stay-flow-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    mem_limit: 160m
    command: ['node', '--enable-source-maps', 'dist/worker.js']
    environment:
      <<: *api-environment
      NODE_OPTIONS: --max-old-space-size=96
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: ghcr.io/ahmad-mosha/stay-flow-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    mem_limit: 224m
    environment:
      # Server components call the API directly on the private network.
      API_URL: http://api:3000
      NODE_OPTIONS: --max-old-space-size=160
    healthcheck:
      test: ['CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1:3001/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    depends_on:
      api:
        condition: service_healthy

  # The only public entry: HTTPS with a Let's Encrypt certificate, then /v1 to the API and the rest
  # to the web app.
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 64m
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - web

  # Catches every email until SMTP_URL points at a real mail server. Its inbox is not public: open
  # it through an SSH tunnel (see README.md).
  mailpit:
    image: axllent/mailpit:v1.31.6
    restart: unless-stopped
    logging: *logging
    mem_limit: 64m
    ports:
      - '127.0.0.1:8025:8025'

  # Monitoring. Prometheus pulls every target's metrics every 15 s and evaluates the alert rules;
  # Alertmanager sends the alerts to Telegram; Grafana draws the dashboards. Only Grafana is public,
  # through Caddy and its own login. The configs are in monitoring/, and deploy.sh reloads them.
  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    logging: *logging
    # Prometheus 3 sets Go's memory limit from this cap, so it collects garbage before reaching it.
    mem_limit: 192m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Whichever comes first: 15 days of history, or 1 GB of the 20 GB disk.
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
    ports:
      - '127.0.0.1:9090:9090' # Through an SSH tunnel only, like Mailpit.
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ['CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1:9090/-/ready']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 2s

  alertmanager:
    image: prom/alertmanager:v0.34.2
    restart: unless-stopped
    logging: *logging
    mem_limit: 48m
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      # One instance: no cluster port for gossip with others.
      - --cluster.listen-address=
    ports:
      - '127.0.0.1:9093:9093'
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    secrets:
      - telegram_bot_token
      - telegram_chat_id

  grafana:
    image: grafana/grafana:13.2.5
    restart: unless-stopped
    logging: *logging
    mem_limit: 192m
    environment:
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN:?}
      # Used when Grafana first creates its database. Change it later with
      # `docker compose exec grafana grafana cli admin reset-admin-password <new>`.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_SECURITY_COOKIE_SECURE: 'true'
      GF_SECURITY_DISABLE_GRAVATAR: 'true'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/bookings.json
      # No calls home and no plugin downloads at startup: less memory, nothing unexpected.
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      # Each bundled data source runs as a process of its own, about 10 MB each. Only Prometheus is
      # used, so the rest stay off. With the Go heap limit below, Grafana stays under 150 MB.
      GF_PLUGINS_DISABLE_PLUGINS: elasticsearch,grafana-postgresql-datasource,grafana-pyroscope-datasource,influxdb,jaeger,loki,mssql,mysql,opentsdb,stackdriver,tempo,zipkin,graphite,cloudwatch,grafana-azure-monitor-datasource,grafana-testdata-datasource
      GOMEMLIMIT: 120MiB
      # No live push to browsers: each dashboard refreshes on its own timer.
      GF_LIVE_MAX_CONNECTIONS: '0'
      GF_LOG_LEVEL: warn
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ['CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 2s
    depends_on:
      - prometheus

  # The server's CPU, memory, swap and disk, read from the host's /proc, /sys and root filesystem.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    logging: *logging
    mem_limit: 32m
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($$|/)
    volumes:
      - /:/host:ro,rslave

  # Postgres's own statistics. It logs in as a role that can read them and nothing else.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped
    logging: *logging
    mem_limit: 32m
    environment:
      DATA_SOURCE_URI: postgres:5432/stayflow?sslmode=disable
      DATA_SOURCE_USER: stayflow_exporter
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_PASSWORD:?}
    depends_on:
      postgres:
        condition: service_healthy

# Alertmanager reads its Telegram settings from files; Compose writes these from .env.
secrets:
  telegram_bot_token:
    environment: TELEGRAM_BOT_TOKEN
  telegram_chat_id:
    environment: TELEGRAM_CHAT_ID

volumes:
  postgres-data:
  # Caddy's certificates and ACME account. Losing them means asking Let's Encrypt again.
  caddy-data:
  caddy-config:
  prometheus-data:
  alertmanager-data:
  # Grafana's users and settings. The dashboards come from monitoring/grafana/dashboards.
  grafana-data:
