# Stay Flow itself and the monitoring stack, wherever they run.
scrape_configs:
  - job_name: api
    static_configs:
      - targets: ['api:9464']

  # Serves no HTTP of its own; its metrics port is the only way to see it is alive.
  - job_name: worker
    static_configs:
      - targets: ['worker:9465']

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']
